# El panel servido por nginx, dentro de Docker (decision 0021). Hace las dos
# cosas que hace el servidor de Vite mientras se desarrolla.
server {
    listen 80;

    # 1. Lo que el panel pide a la API va por /api, y aqui se le quita el
    # prefijo antes de reenviarlo (la barra final del proxy_pass): /api/sensores
    # llega a la API como /sensores, igual que con Vite (decision 0016). 'api'
    # es el nombre del servicio en el compose, y Docker lo resuelve.
    location /api/ {
        proxy_pass http://api:8005/;
    }

    root /usr/share/nginx/html;

    # 2. El panel tiene direcciones propias, como /sensores/<id>, que no son
    # ficheros. Si el fichero no existe, se devuelve index.html y React decide
    # que pantalla toca; sin esto, recargar en el detalle daria un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
