# Las mismas comprobaciones que el hook pre-push, pero en GitHub: en cada push
# y en cada pull request, y dejando constancia en cada commit.
#
# No cuesta nada porque el repositorio es publico: en uno publico, los runners
# estandar de GitHub Actions no gastan minutos. Si algun dia pasa a privado,
# esto empieza a contar contra el cupo del plan, y hay que volver a mirar la
# decision 0005.
#
# No lleva su propia lista: llama a check.sh, que es la unica.
name: comprobaciones

on:
  push:
  pull_request:

# Solo leer el codigo. Un workflow que no escribe nada no necesita mas, y un
# token con menos permisos es uno que hace menos dano si algo se tuerce.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Sin esto, un trabajo colgado corre hasta el limite por defecto de GitHub,
    # que son seis horas.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # check.sh corre tambien las pruebas de la API, que necesitan las
      # dependencias de backend/. npm ci instala exactamente las versiones de
      # package-lock.json, y falla si el lock no cuadra con package.json.
      - run: npm ci --prefix backend
      # Las pruebas del panel compilan el panel y lo abren en un navegador.
      - run: npm ci --prefix frontend
      # Solo Chromium: probar tambien en Firefox y WebKit seria triplicar el
      # tiempo para ver lo mismo (decision 0020). --with-deps instala en Ubuntu
      # las librerias del sistema que el navegador necesita.
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash check.sh
